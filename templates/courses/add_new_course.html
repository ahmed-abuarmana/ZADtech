{% extends "core/layout.html" %}
{% load static %}

{% block head %}
    <title>Add New Course</title>
    <link href="{% static 'courses/css/add_new_course.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock head %}

{% block body %}

<!-- Toast Notification -->
<div id="successToast" style="display: none; position: fixed; width: 200px; top: -400px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #204a87, #4e7dbf); padding: 20px 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: top 0.5s ease-in-out; z-index: 9999; text-align: center; font-family: 'Almarai', sans-serif;">
    <h3 style="margin:0; color: #fff;">تم إضافة الدورة بنجاح</h3>
    <p style="margin:5px 0 0 0; color:#fff;">شكراً لك!</p>
</div>

<div class="post-container fade-in">
    <div class="logo">
        <img src="{% static 'core/images/logo.png' %}" alt="ZAD Logo">
    </div>
    
    <h2 class="post-title">إضافة دورة جديدة</h2>

    <!-- Display Messages -->
    {% if messages %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}
    
    <form method="POST" enctype="multipart/form-data" class="post-form">
        {% csrf_token %}
        
        <div class="inputs-area">
            <!-- Title -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_brush" data-name="vuesax/linear/brush" transform="translate(-234 -254)">
                        <g id="brush" transform="translate(234 254)">
                            <path id="Vector" d="M15.4,0H11.977C3.422,0,0,3.422,0,11.977V22.243C0,30.8,3.422,34.22,11.977,34.22H22.243C30.8,34.22,34.22,30.8,34.22,22.243V18.821" transform="translate(3.339 3.39)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-2" data-name="Vector" d="M21.087,2.645a45.76,45.76,0,0,1-11.7,15.8L6.713,20.579a4.463,4.463,0,0,1-1.068.61,6.223,6.223,0,0,0-.051-.78,5.268,5.268,0,0,0-1.576-3.1,5.53,5.53,0,0,0-3.2-1.61A6.52,6.52,0,0,0,0,15.68a3.45,3.45,0,0,1,.661-1.136L2.8,11.866A46.012,46.012,0,0,1,18.6.136,1.919,1.919,0,0,1,20.663.56,1.893,1.893,0,0,1,21.087,2.645Z" transform="translate(16.32 3.39)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M11.46,5.516a5.672,5.672,0,0,1-1.644,4,5.579,5.579,0,0,1-3.288,1.576l-3.339.356A2.88,2.88,0,0,1,.018,8.262L.374,4.923A5.514,5.514,0,0,1,5.815.007a6.52,6.52,0,0,1,.814.017,5.53,5.53,0,0,1,3.2,1.61,5.316,5.316,0,0,1,1.576,3.1A6.434,6.434,0,0,1,11.46,5.516Z" transform="translate(10.314 19.253)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M6.424,6.424A6.42,6.42,0,0,0,0,0" transform="translate(20.581 14.012)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-5" data-name="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                        </g>
                    </g>
                </svg>
                <input type="text" name="title" placeholder="العنوان" class="input-field" required>
            </div>

            <!-- Teacher Name -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_profile" data-name="vuesax/linear/profile" transform="translate(-748 -314)">
                        <g id="profile" transform="translate(748 314)">
                            <path id="Vector" d="M31.417,21.958A17.667,17.667,0,0,0,17.667,2.958,17.667,17.667,0,0,0,0,21.958" transform="translate(3.792 4.625)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-2" data-name="Vector" d="M0,7.916a13.458,13.458,0,0,1,26.917,0" transform="translate(7.041 5.458)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                        </g>
                    </g>
                </svg>
                <input type="text" name="teacher_name" placeholder="اسم المعلم" class="input-field" required>
            </div>

            <!-- Channel Name -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_video-play" data-name="vuesax/linear/video-play" transform="translate(-748 -314)">
                        <g id="video-play" transform="translate(748 314)">
                            <path id="Vector" d="M10.25,0H0" transform="translate(15.375 19.542)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-2" data-name="Vector" d="M7.084,0H3.542A7.335,7.335,0,0,0,0,7.084v3.542A7.335,7.335,0,0,0,3.542,17.708H7.084A7.335,7.335,0,0,0,10.625,10.625V7.084A7.335,7.335,0,0,0,7.084,0Z" transform="translate(15.188 5.542)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                        </g>
                    </g>
                </svg>
                <input type="text" name="channel_name" placeholder="اسم القناة" class="input-field" required>
            </div>

            <!-- Category -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_category" data-name="vuesax/linear/category" transform="translate(-748 -314)">
                        <g id="category" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M7.76,0A7.76,7.76,0,1,0,0,7.76,7.76,7.76,0,0,0,7.76,0Z" transform="translate(0.973 0.973)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M7.76,0A7.76,7.76,0,1,0,0,7.76,7.76,0,0,0,7.76,0Z" transform="translate(0.973 32.267)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M0,0A7.76,7.76,0,1,0,7.76,7.76,7.76,7.76,0,0,0,0,0Z" transform="translate(32.267 0.973)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-5" data-name="Vector" d="M0,0A7.76,7.76,0,1,0,7.76,7.76,7.76,7.76,0,0,0,0,0Z" transform="translate(32.267 32.267)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <select name="category" class="input-field" required>
                    <option value="">اختر التصنيف</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name_ar }} ({{ category.name }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Field -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_4square" data-name="vuesax/linear/4square" transform="translate(-748 -314)">
                        <g id="_4square" data-name="4square" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M0,0H17.708V17.708H0Z" transform="translate(0.854 0.854)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0H17.708V17.708H0Z" transform="translate(22.438 0.854)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M0,0H17.708V17.708H0Z" transform="translate(0.854 22.438)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-5" data-name="Vector" d="M0,0H17.708V17.708H0Z" transform="translate(22.438 22.438)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <select name="field" class="input-field" required>
                    <option value="">اختر المجال</option>
                    {% for field in fields %}
                        <option value="{{ field.id }}">{{ field.name_ar }} ({{ field.name }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Language -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_global" data-name="vuesax/linear/global" transform="translate(-748 -314)">
                        <g id="global" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M18.584,0A18.584,18.584,0,1,0,0,18.584,18.584,18.584,0,0,0,18.584,0Z" transform="translate(3.708 3.708)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0H13.084" transform="translate(20.833 6.625)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M0,0H13.084" transform="translate(7 18.584)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-5" data-name="Vector" d="M0,0A18.6,18.6,0,0,0,0,13.084" transform="translate(20.833 18.584)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-6" data-name="Vector" d="M0,0A18.6,18.6,0,0,0,13.084,0" transform="translate(7 18.584)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <input type="text" name="language" placeholder="اللغة" class="input-field" required>
            </div>

            <!-- Duration -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_clock" data-name="vuesax/linear/clock" transform="translate(-748 -314)">
                        <g id="clock" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M18.584,0A18.584,18.584,0,1,0,0,18.584,18.584,18.584,0,0,0,18.584,0Z" transform="translate(3.708 3.708)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0V7.417L5.562,9.271" transform="translate(13.887 11.125)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <input type="text" name="duration" placeholder="المدة" class="input-field" required>
            </div>

            <!-- Description -->
            <div class="input-wrapper">
                <svg class="description-input" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_message-text" data-name="vuesax/linear/message-text" transform="translate(-748 -314)">
                        <g id="message-text" transform="translate(748 314)">
                            <path id="Vector" d="M23.917,0H10.25Q0,0,0,10.25V32.458a1.713,1.713,0,0,0,1.708,1.708H23.917q10.25,0,10.25-10.25V10.25Q34.167,0,23.917,0Z" transform="translate(3.417 3.417)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <g id="Group" transform="translate(11.958 16.229)">
                                <path id="Vector-2" data-name="Vector" d="M0,0H17.083" fill="#fff" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                                <path id="Vector-3" data-name="Vector" d="M0,0H11.958" transform="translate(0 8.542)" fill="#fff" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            </g>
                            <path id="Vector-4" data-name="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                        </g>
                    </g>
                </svg>
                <textarea name="description" placeholder="الوصف" class="textarea-field" required></textarea>
            </div>

            <!-- Link -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_link" data-name="vuesax/linear/link" transform="translate(-748 -314)">
                        <g id="link" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M5.936,3.958A3.958,3.958,0,0,1,11.083,0L7.084,3.958Z" transform="translate(3.958 5.542)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,5.936A3.958,3.958,0,0,0,0,11.083L3.958,7.084Z" transform="translate(18.542 16.542)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M2.625,0A11.875,11.875,0,0,1,0,0" transform="translate(4.708 15.333)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-5" data-name="Vector" d="M0,2.625A11.875,11.875,0,0,1,0,0" transform="translate(17.167 7.042)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <input type="url" name="link" placeholder="الرابط" class="input-field" required>
            </div>

            <!-- Level -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_chart" data-name="vuesax/linear/chart" transform="translate(-748 -314)">
                        <g id="chart" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M0,0V17.708" transform="translate(6.25 11.458)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M0,0H17.708" transform="translate(11.458 17.708)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-4" data-name="Vector" d="M0,0V6.25" transform="translate(6.25 11.458)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <select name="level" class="input-field" required>
                    <option value="Beginner">مبتدئ</option>
                    <option value="Intermediate">متوسط</option>
                    <option value="Advanced">متقدم</option>
                </select>
            </div>

            <!-- Rating -->
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
                    <g id="vuesax_linear_star" data-name="vuesax/linear/star" transform="translate(-748 -314)">
                        <g id="star" transform="translate(748 314)">
                            <path id="Vector" d="M0,0H41V41H0Z" fill="none" opacity="0"/>
                            <path id="Vector-2" data-name="Vector" d="M0,0A18.584,18.584,0,1,0,18.584,18.584,18.584,18.584,0,0,0,0,0Z" transform="translate(3.708 3.708)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                            <path id="Vector-3" data-name="Vector" d="M5.562,0,7.24,3.5,11.125,4.063,8.344,6.762,9.018,10.625,5.562,8.787,2.106,10.625,2.78,6.762,0,4.063,3.884,3.5Z" transform="translate(13.887 13.887)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                        </g>
                    </g>
                </svg>
                <input type="number" step="0.1" name="rating" placeholder="التقييم" class="input-field">
            </div>

            <!-- Thumbnail Upload -->
            <label for="file-upload" class="upload-area">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="222.995" height="222.995" viewBox="0 0 222.995 222.995">
                    <g id="vuesax_linear_instagram" data-name="vuesax/linear/instagram" transform="translate(-300 -444)">
                        <g id="instagram" transform="translate(300 444)">
                            <path id="Vector" d="M65.04,185.829h55.749c46.457,0,65.04-18.583,65.04-65.04V65.04c0-46.457-18.583-65.04-65.04-65.04H65.04C18.583,0,0,18.583,0,65.04v55.749C0,167.246,18.583,185.829,65.04,185.829Z" transform="translate(18.583 18.583)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
                            <path id="Vector-2" data-name="Vector" d="M0,0H222.995V222.995H0Z" fill="none" opacity="0"/>
                            <path id="Vector-3" data-name="Vector" d="M65.04,32.52A32.52,32.52,0,1,1,32.52,0,32.52,32.52,0,0,1,65.04,32.52Z" transform="translate(78.977 78.977)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
                            <path id="Vector-4" data-name="Vector" d="M.636.5H.743" transform="translate(163.229 64.54)" fill="none" stroke="#292d32" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
                        </g>
                    </g>
                </svg>
                <p>تحميل الصورة المصغرة</p>
                <input id="file-upload" type="file" name="thumbnail" style="display:none;">
            </label>

            <!-- Checkboxes: Is Free & Certificate -->
            <div style="display: flex; gap: 30px; justify-content: center; margin: 20px 0; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; gap: 10px; font-family: 'Almarai', sans-serif; font-size: 16px; cursor: pointer;">
                    <input type="checkbox" name="is_free" style="width: 20px; height: 20px; accent-color: #1a3a6a; cursor: pointer;">
                    مجاني؟
                </label>
                <label style="display: flex; align-items: center; gap: 10px; font-family: 'Almarai', sans-serif; font-size: 16px; cursor: pointer;">
                    <input type="checkbox" name="certificate" style="width: 20px; height: 20px; accent-color: #1a3a6a; cursor: pointer;">
                    شهادة
                </label>
            </div>
        </div>

        <button type="submit" class="post-btn" onclick="handlePublish()">
            <svg class="Publish-now" xmlns="http://www.w3.org/2000/svg" width="45.941" height="45.941" viewBox="0 0 45.941 45.941">
                <g id="vuesax_linear_direct-send" data-name="vuesax/linear/direct-send" transform="translate(-620 -186)">
                    <g id="direct-send" transform="translate(620 186)">
                        <path id="Vector" d="M3.828,13.4V0L0,3.828" transform="translate(19.142 3.828)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>

<script>
    // Animation
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, {
        threshold: 0.1
    });

    document.querySelectorAll('.fade-in').forEach(el => {
        observer.observe(el);
    });
</script>

<script>
    function handlePublish() {
        const toast = document.getElementById('successToast');
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.top = '30px';
        }, 10);
        
        setTimeout(() => {
            toast.style.top = '-400px';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 500);
        }, 3000);
    }
</script>
