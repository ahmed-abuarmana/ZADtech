{% extends "core/layout.html" %}
{% load static %}

{% block head %}
    <title>Add New Course</title>
    <link href="{% static 'courses/css/add_new_course.css' %}" rel="stylesheet">

{% endblock head %}

{% block body %}

<h1>Add New Course</h1>

<h3>{% if messages %}{% for message in messages %}{{ message }}{% endfor %}{% endif %}</h3>


<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Title</label>
    <input type="text" name="title">

    <label>Teacher Name</label>
    <input type="text" name="teacher_name">

    <label>Channel Name</label>
    <input type="text" name="channel_name">

    <label>Category</label>
    <select name="category">
        <option value="">---------</option>
        {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name_ar }} ({{ category.name }})</option>
        {% endfor %}
    </select>

    <label>Field</label>
    <select name="field">
        <option value="">---------</option>
        {% for field in fields %}
            <option value="{{ field.id }}">{{ field.name_ar }} ({{ field.name }})</option>
        {% endfor %}
    </select>

    <label>Language</label>
    <input type="text" name="language">

    <label>Duration</label>
    <input type="text" name="duration">

    <label>Description</label>
    <textarea name="description"></textarea>

    <label>Link</label>
    <input type="url" name="link">

    <label>Thumbnail</label>
    <input type="file" name="thumbnail">

    <label>Level</label>
    <select name="level">
        <option value="Beginner">مبتدئ</option>
        <option value="Intermediate">متوسط</option>
        <option value="Advanced">متقدم</option>
    </select>

    <label>Is Free?</label>
    <input type="checkbox" name="is_free">

    <label>Certificate</label>
    <input type="checkbox" name="certificate">

    <label>Rating</label>
    <input type="number" step="0.1" name="rating">

    <button type="submit">Save</button>
</form>




{% endblock body %}
