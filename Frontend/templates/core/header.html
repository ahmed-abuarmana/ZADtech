<!-- القائمة الجانبية للجوال -->
<div class="mobile-menu">
  <div class="close-btn">&times;</div>
  
  <a href="/">الرئيسية</a>
  <a href="/about">تعلّم عن الموقع</a>
  <a href="/books">كتب</a>
  <a href="/courses">الدورات التدريبية</a>
  <a href="/articles">المقالات</a>
  <a href="/podcasts">البودكاست</a>
  <div class="login-btn">
  <a href="/login">تسجيل الدخول</a>
  </div>
</div>

<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const closeBtn = document.querySelector('.close-btn');
    const mobileMenu = document.querySelector('.mobile-menu');

    // 1. فتح القائمة بالضغط على الـ 3 شرطات
    if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenu.classList.add('active');
        });
    }

    // 2. إغلاق القائمة بالضغط على زر الـ X 
    if (closeBtn && mobileMenu) {
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenu.classList.remove('active');
        });
    }

    // 3. إغلاق القائمة إذا ضغط المستخدم خارجها في أي مكان بالصفحة
    document.addEventListener('click', (e) => {
        if (mobileMenu && !mobileMenu.contains(e.target) && e.target !== menuToggle) {
            mobileMenu.classList.remove('active');
        }
    });
</script>


 <script>
document.addEventListener("DOMContentLoaded", function () {
    const navLinks = document.querySelectorAll(".nav-links a, .mobile-menu a");

    navLinks.forEach(link => {
        link.addEventListener("click", function () {
            // إزالة اللون الأصفر وتأثير الخط عن كل الروابط
            navLinks.forEach(item => {
                item.style.color = "";
                let afterElem = item.querySelector("::after");
                item.classList.remove("clicked-active");
            });
            
            // تطبيق اللون الأصفر حصرياً على العنصر الذي تم الضغط عليه
            this.style.setProperty("color", "#ffca47", "important");
            this.classList.add("clicked-active");
        });
    });
});
</script>
