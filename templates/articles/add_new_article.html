{% extends "core/layout.html" %}
{% load static %}

{% block head %}
<title>نشر مقال</title>
<link rel="stylesheet" href="{% static 'articles/css/add_new_article.css' %}">
{% endblock %}

{% block body %}

<div class="post-container fade-in">

    <h2 class="post-title">نشر مقال</h2>


    {% if messages %}
        {% for message in messages %}
            <div id="successToast" class="success-toast">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}


    <form
        id="articleForm"
        method="POST"
        enctype="multipart/form-data"
        class="post-form">

        {% csrf_token %}

        <div class="inputs-area">

            <!-- اسم الكاتب -->
            <div class="input-wrapper">
                <input
                    type="text"
                    name="author_name"
                    class="input-field"
                    placeholder="اسم الكاتب"
                    required>
            </div>

            <!-- المجال -->
            <div class="input-wrapper">
                <select name="field" class="input-field" required>
                    <option value="">اختر المجال</option>

                    {% for field in fields %}
                        <option value="{{ field.id }}">
                            {{ field.name_ar }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- التصنيف -->
            <div class="input-wrapper">
                <select name="category" class="input-field" required>
                    <option value="">اختر التصنيف</option>

                    {% for category in categories %}
                        <option value="{{ category.id }}">
                            {{ category.name_ar }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- محتوى المقال -->
            <div class="input-wrapper">
                <textarea
                    name="content"
                    class="textarea-field"
                    placeholder="اكتب المقال هنا..."
                    rows="10"
                    required></textarea>
            </div>

        </div>

        <!-- الصورة -->
        <label for="image-upload" class="upload-area">
            <p>تحميل صورة للمقال (اختياري)</p>

            <input
                id="image-upload"
                type="file"
                name="image"
                accept="image/*"
                style="display:none;">
        </label>

        <button type="submit" class="post-btn">
            نشر الآن
        </button>

    </form>

</div>

<script>
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("visible");
        }
    });
},{threshold:.1});

document.querySelectorAll(".fade-in").forEach(el=>{
    observer.observe(el);
});


const toast = document.getElementById("successToast");

if (toast) {
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.top = "30px";
    }, 50);

    setTimeout(() => {
        toast.style.top = "-400px";
    }, 3000);
}


</script>

{% endblock %}
